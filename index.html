<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090d14">
<meta name="description" content="HeMa Tools - مجموعة أدوات مجانية وسريعة تعمل مباشرة من المتصفح">
<title>HeMa Tools</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:"Cairo",sans-serif;
    background:#070b12;
    color:#f8fafc;
    min-height:100vh;
}

button,input,select,textarea{
    font-family:inherit;
}

.container-main{
    width:min(1200px,94%);
    margin:auto;
}

/* Header */
header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(7,11,18,.88);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,255,255,.07);
}

.header-inner{
    min-height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

/* HeMa Brand */
.hema-brand{
    display:flex;
    align-items:center;
    gap:9px;
    text-decoration:none;
    direction:ltr;
    white-space:nowrap;
}

.hema-name{
    color:#ef2b2b;
    font-size:22px;
    font-weight:800;
    letter-spacing:-.5px;
    animation:hemaGlow 1.8s ease-in-out infinite;
}

.online-dot{
    width:11px;
    height:11px;
    background:#22c55e;
    border-radius:50%;
    display:inline-block;
    box-shadow:
        0 0 5px #22c55e,
        0 0 12px #22c55e,
        0 0 20px rgba(34,197,94,.8);
    animation:onlinePulse 1.8s ease-in-out infinite;
}

@keyframes hemaGlow{
    0%,100%{
        opacity:.45;
        text-shadow:0 0 3px rgba(239,43,43,.2);
    }
    50%{
        opacity:1;
        text-shadow:
            0 0 5px #ef2b2b,
            0 0 12px #ef2b2b,
            0 0 22px rgba(239,43,43,.8);
    }
}

@keyframes onlinePulse{
    0%,100%{
        opacity:.35;
        transform:scale(.8);
        box-shadow:0 0 3px #22c55e;
    }
    50%{
        opacity:1;
        transform:scale(1.15);
        box-shadow:
            0 0 6px #22c55e,
            0 0 15px #22c55e,
            0 0 25px rgba(34,197,94,.9);
    }
}

.header-actions{
    display:flex;
    align-items:center;
    gap:9px;
}

.icon-btn,
.lang-select{
    height:42px;
    border:1px solid rgba(255,255,255,.08);
    background:#111722;
    color:#e5e7eb;
    border-radius:12px;
}

.icon-btn{
    width:42px;
    cursor:pointer;
    font-size:18px;
}

.lang-select{
    padding:0 12px;
    outline:none;
}

/* Hero */
.hero{
    padding:58px 0 34px;
    text-align:center;
}

.hero-badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:7px 13px;
    border-radius:999px;
    background:rgba(239,43,43,.08);
    border:1px solid rgba(239,43,43,.18);
    color:#fca5a5;
    font-size:13px;
    margin-bottom:18px;
}

.hero h1{
    margin:0;
    font-size:clamp(30px,6vw,56px);
    line-height:1.15;
    font-weight:800;
}

.hero h1 span{
    color:#ef4444;
}

.hero p{
    color:#94a3b8;
    max-width:700px;
    margin:17px auto 0;
    line-height:1.9;
    font-size:15px;
}

/* Search */
.search-wrap{
    margin:28px auto 25px;
    max-width:700px;
    position:relative;
}

.search-wrap input{
    width:100%;
    height:56px;
    padding:0 52px 0 18px;
    border-radius:17px;
    border:1px solid rgba(255,255,255,.08);
    outline:none;
    background:#101722;
    color:#fff;
    font-size:15px;
    transition:.2s;
}

.search-wrap input:focus{
    border-color:rgba(239,68,68,.55);
    box-shadow:0 0 0 4px rgba(239,68,68,.08);
}

.search-icon{
    position:absolute;
    right:18px;
    top:50%;
    transform:translateY(-50%);
    color:#64748b;
    font-size:20px;
}

/* Categories */
.categories{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:3px 2px 12px;
    scrollbar-width:none;
}

.categories::-webkit-scrollbar{
    display:none;
}

.category-btn{
    flex:none;
    border:1px solid rgba(255,255,255,.07);
    background:#101722;
    color:#94a3b8;
    padding:9px 15px;
    border-radius:11px;
    cursor:pointer;
    transition:.2s;
}

.category-btn:hover{
    color:#fff;
    border-color:rgba(239,68,68,.35);
}

.category-btn.active{
    background:#ef2b2b;
    color:#fff;
    border-color:#ef2b2b;
}

/* Tools Grid */
.tools-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    padding:18px 0 45px;
}

.tool-card{
    background:linear-gradient(145deg,#101722,#0d131d);
    border:1px solid rgba(255,255,255,.07);
    border-radius:18px;
    padding:18px;
    transition:.25s;
    min-height:180px;
    display:flex;
    flex-direction:column;
}

.tool-card:hover{
    transform:translateY(-3px);
    border-color:rgba(239,68,68,.25);
    box-shadow:0 12px 35px rgba(0,0,0,.22);
}

.tool-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.tool-icon{
    width:46px;
    height:46px;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(239,68,68,.10);
    font-size:23px;
}

.tool-card h3{
    font-size:16px;
    margin:14px 0 5px;
}

.tool-card p{
    color:#64748b;
    font-size:12px;
    line-height:1.7;
    margin:0 0 15px;
}

.tool-open{
    margin-top:auto;
    width:100%;
    height:42px;
    border:0;
    border-radius:11px;
    background:#171f2d;
    color:#e2e8f0;
    cursor:pointer;
    transition:.2s;
}

.tool-open:hover{
    background:#ef2b2b;
    color:#fff;
}

/* Empty */
.empty{
    display:none;
    text-align:center;
    color:#64748b;
    padding:50px 10px;
}

/* Modal */
.modal{
    position:fixed;
    inset:0;
    z-index:200;
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(8px);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(560px,100%);
    max-height:90vh;
    overflow:auto;
    background:#0e151f;
    border:1px solid rgba(255,255,255,.09);
    border-radius:22px;
    box-shadow:0 30px 90px rgba(0,0,0,.5);
}

.modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:19px 20px;
    border-bottom:1px solid rgba(255,255,255,.07);
}

.modal-head h2{
    margin:0;
    font-size:19px;
}

.close-btn{
    width:38px;
    height:38px;
    border:0;
    border-radius:10px;
    background:#171f2d;
    color:#cbd5e1;
    cursor:pointer;
    font-size:19px;
}

.modal-body{
    padding:20px;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    color:#cbd5e1;
    font-size:13px;
    margin-bottom:7px;
}

.form-control{
    width:100%;
    min-height:45px;
    padding:9px 12px;
    background:#090f18;
    border:1px solid rgba(255,255,255,.09);
    color:#fff;
    border-radius:11px;
    outline:none;
}

.form-control:focus{
    border-color:#ef4444;
}

textarea.form-control{
    min-height:130px;
    resize:vertical;
}

.action-btn{
    width:100%;
    min-height:46px;
    border:0;
    border-radius:12px;
    background:#ef2b2b;
    color:#fff;
    font-weight:700;
    cursor:pointer;
    margin-top:4px;
}

.action-btn:hover{
    background:#dc2626;
}

.secondary-btn{
    width:100%;
    min-height:43px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:11px;
    background:#171f2d;
    color:#e2e8f0;
    cursor:pointer;
    margin-top:9px;
}

.result{
    margin-top:15px;
    padding:15px;
    border-radius:12px;
    background:#090f18;
    border:1px solid rgba(255,255,255,.07);
    color:#f8fafc;
    line-height:1.8;
    text-align:center;
    word-break:break-word;
}

.result strong{
    color:#f87171;
    font-size:20px;
}

.two-cols{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.color-preview{
    width:100%;
    height:80px;
    border-radius:12px;
    margin-top:12px;
    border:1px solid rgba(255,255,255,.08);
}

.qr-result img{
    max-width:240px;
    width:100%;
    background:#fff;
    padding:10px;
    border-radius:12px;
}

/* Footer */
footer{
    border-top:1px solid rgba(255,255,255,.07);
    padding:28px 0;
    color:#64748b;
    text-align:center;
    font-size:13px;
}

footer strong{
    color:#ef4444;
}

/* Light mode */
html.light body{
    background:#f5f7fb;
    color:#111827;
}

html.light header{
    background:rgba(255,255,255,.88);
    border-color:#e5e7eb;
}

html.light .search-wrap input,
html.light .category-btn,
html.light .tool-card,
html.light .icon-btn,
html.light .lang-select{
    background:#fff;
    color:#111827;
    border-color:#e5e7eb;
}

html.light .tool-card p{
    color:#64748b;
}

html.light .tool-open{
    background:#f1f5f9;
    color:#334155;
}

html.light .modal-box{
    background:#fff;
    color:#111827;
}

html.light .modal-head{
    border-color:#e5e7eb;
}

html.light .form-control,
html.light .result{
    background:#f8fafc;
    color:#111827;
    border-color:#e2e8f0;
}

html.light .close-btn,
html.light .secondary-btn{
    background:#f1f5f9;
    color:#334155;
}

/* Responsive */
@media(max-width:900px){
    .tools-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){
    .header-inner{
        min-height:64px;
    }

    .hema-name{
        font-size:19px;
    }

    .online-dot{
        width:9px;
        height:9px;
    }

    .hema-brand{
        gap:7px;
    }

    .hero{
        padding:40px 0 25px;
    }

    .hero h1{
        font-size:31px;
    }

    .hero p{
        font-size:13px;
    }

    .tools-grid{
        grid-template-columns:1fr;
        gap:12px;
    }

    .tool-card{
        min-height:165px;
    }

    .two-cols{
        grid-template-columns:1fr;
    }

    .lang-select{
        display:none;
    }

    .modal{
        padding:10px;
    }

    .modal-box{
        max-height:92vh;
        border-radius:18px;
    }
}

@media(max-width:380px){
    .header-actions{
        gap:5px;
    }

    .icon-btn{
        width:38px;
        height:38px;
    }

    .hero h1{
        font-size:27px;
    }
}
</style>
</head>

<body>

<header>
    <div class="container-main header-inner">

        <a
            href="https://wa.me/201094122436?text=%D9%85%D8%B1%D8%AD%D8%A8%D8%A7%D9%8B%20HeMa%20Tools%D8%8C%20%D8%A3%D8%B1%D9%8A%D8%AF%20%D8%A7%D9%84%D8%AA%D9%88%D8%A7%D8%B5%D9%84%20%D9%85%D8%B9%D9%83"
            target="_blank"
            rel="noopener noreferrer"

        >
            <span class="online-dot"></span>
            <span class="hema-name">HeMa Tools</span>
        </a>

        <div class="header-actions">
            <select id="language" class="lang-select">
                <option value="ar">العربية</option>
                <option value="en">English</option>
            </select>

            <button class="icon-btn" id="themeBtn" title="تغيير المظهر">
                ☀️
            </button>
        </div>

    </div>
</header>


<main class="container-main">

    <section class="hero">

        <div class="hero-badge">
            ⚡ أدوات مجانية وسريعة
        </div>

        <h1>
            كل أدواتك في مكان واحد مع
            <span>HeMa Tools</span>
        </h1>

        <p>
            مجموعة من الأدوات المفيدة للحساب، النصوص، الصور، التحويلات
            والمزيد. كل الأدوات تعمل مباشرة من المتصفح.
        </p>

        <div class="search-wrap">
            <span class="search-icon">⌕</span>
            <input
                id="searchInput"

            >

    </section>


    <div class="categories" id="categories">
        <button class="category-btn active" data-cat="all">الكل</button>
        <button class="category-btn" data-cat="math">الحساب</button>
        <button class="category-btn" data-cat="convert">تحويلات</button>
        <button class="category-btn" data-cat="text">النصوص</button>
        <button class="category-btn" data-cat="developer">برمجة</button>
        <button class="category-btn" data-cat="image">الصور</button>
        <button class="category-btn" data-cat="other">أخرى</button>
    </div>


    <section class="tools-grid" id="toolsGrid"></section>

    <div class="empty" id="empty">
        🔎 لم يتم العثور على أداة بهذا الاسم.
    </div>

</main>


<footer>
    <div class="container-main">
        جميع الحقوق محفوظة © <strong>HeMa Tools</strong>
    </div>
</footer>


<div class="modal" id="modal">
    <div class="modal-box">

        <div class="modal-head">
            <h2 id="modalTitle">الأداة</h2>
            <button class="close-btn" id="closeModal">✕</button>
        </div>

        <div class="modal-body" id="modalBody"></div>

    </div>
</div>


<script>
"use strict";

/* =========================
   أدوات الموقع
========================= */

const tools = [

{
    id:"percent",
    title:"حساب النسبة المئوية",
    desc:"احسب النسبة المئوية بين رقمين بسهولة.",
    icon:"📊",
    cat:"math"
},

{
    id:"discount",
    title:"حاسبة الخصم",
    desc:"احسب السعر بعد الخصم وقيمة الخصم.",
    icon:"🏷️",
    cat:"math"
},

{
    id:"tip",
    title:"حاسبة البقشيش",
    desc:"احسب البقشيش والإجمالي بسرعة.",

},

{
    id:"installment",

    cat:"math"
},

{
    id:"age",

    desc:"احسب عمرك بالسنوات والأشهر والأيام.",

},

{
    id:"bmi",
    title:"حاسبة BMI",
    desc:"احسب مؤشر كتلة الجسم.",
    icon:"⚖️",
    cat:"other"
},

{
    id:"calories",
    title:"حاسبة السعرات",
    desc:"تقدير احتياجك اليومي من السعرات.",
    icon:"🔥",
    cat:"other"
},

{
    id:"gpa",
    title:"حاسبة GPA",
    desc:"احسب المعدل التقريبي من النسبة.",
    icon:"🎓",
    cat:"math"
},

{
    id:"datediff",
    title:"فرق التاريخ",
    desc:"احسب الفرق بين تاريخين.",
    icon:"📅",
    cat:"other"
},

{
    id:"speed",
    title:"حاسبة السرعة",
    desc:"احسب السرعة أو المسافة أو الزمن.",
    icon:"🚗",
    cat:"math"
},

{
    id:"length",
    title:"محول الطول",
    desc:"تحويل بين متر، كيلومتر، سم وغيرها.",
    icon:"📏",
    cat:"convert"
},

{
    id:"weight",
    title:"محول الوزن",
    desc:"تحويل بين كجم، جرام، رطل وغيرها.",
    icon:"⚖️",
    cat:"convert"
},

{
    id:"temperature",
    title:"محول الحرارة",
    desc:"تحويل بين Celsius و Fahrenheit و Kelvin.",
    icon:"🌡️",
    cat:"convert"
},

{
    id:"data",
    title:"محول البيانات",
    desc:"تحويل KB و MB و GB و TB.",
    icon:"💾",
    cat:"convert"
},

{
    id:"timediff",
    title:"فرق الوقت",
    desc:"احسب الفرق بين وقتين.",
    icon:"⏱️",
    cat:"other"
},

{
    id:"words",
    title:"عداد الكلمات",
    desc:"احسب الكلمات والحروف والأسطر.",
    icon:"📝",
    cat:"text"
},

{
    id:"case",
    title:"تغيير حالة النص",
    desc:"تحويل النص إلى UPPERCASE أو lowercase.",
    icon:"🔤",
    cat:"text"
},

{
    id:"reverse",
    title:"عكس النص",
    desc:"اعكس ترتيب الحروف والكلمات.",

},

{

    title:"Base64",
    desc:"تشفير وفك تشفير النص باستخدام Base64.",

},

{
    id:"url",
    title:"URL Encoder",
    desc:"ترميز وفك ترميز روابط ونصوص URL.",
    icon:"🔗",
    cat:"developer"
},

{
    id:"json",
    title:"JSON Formatter",
    desc:"تنسيق JSON والتحقق من صحته.",

},

{

{

},

{
    id:"color",
    title:"منتقي الألوان",
    desc:"اختر لوناً واعرف كوده HEX و RGB.",
    icon:"🎨",

},

{

    icon:"💻",

},

{
    id:"resize",

    cat:"image"
},

{
    id:"compress",
    title:"ضغط الصورة",
    desc:"تقليل حجم الصورة باستخدام المتصفح.",
    icon:"🗜️",
    cat:"image"
},

{
    id:"pdf",
    title:"الصورة إلى PDF",
    desc:"تحويل صورة إلى ملف PDF باستخدام الطباعة.",
    icon:"📄",
    cat:"image"
},

{
    id:"clock",
    title:"الساعة والتاريخ",
    desc:"اعرض الوقت والتاريخ الحاليين.",
    icon:"🕐",
    cat:"other"
}

];


/* =========================
   العناصر
========================= */

const grid = document.getElementById("toolsGrid");
const searchInput = document.getElementById("searchInput");
const empty = document.getElementById("empty");

const modal = document.getElementById("modal");
const modalTitle = document.getElementById("modalTitle");
const modalBody = document.getElementById("modalBody");

let currentCategory = "all";


/* =========================
   عرض الأدوات
========================= */

function renderTools(){

    const query = searchInput.value.trim().toLowerCase();

    const filtered = tools.filter(tool => {

        const matchesCategory =
            currentCategory === "all" ||
            tool.cat === currentCategory;

        const text =
            (tool.title + " " + tool.desc).toLowerCase();

        const matchesSearch =
            !query || text.includes(query);

        return matchesCategory && matchesSearch;
    });

    grid.innerHTML = "";

    filtered.forEach(tool => {

        const card = document.createElement("div");

        card.className = "tool-card";

        card.innerHTML = `
            <div class="tool-top">
                <div class="tool-icon">${tool.icon}</div>
            </div>

            <h3>${tool.title}</h3>

            <p>${tool.desc}</p>

            <button
                class="tool-open"
                onclick="openTool('${tool.id}')"
            >
                فتح الأداة
            </button>
        `;

        grid.appendChild(card);
    });

    empty.style.display =
        filtered.length ? "none" : "block";
}

/* =========================
   Modal
========================= */

function openTool(id){

    const tool = tools.find(x=>x.id===id);

    if(!tool) return;

    modalTitle.textContent = tool.title;

    modalBody.innerHTML = getToolHTML(id);

    modal.classList.add("show");

    if(id === "clock"){
        startClock();
    }

    if(id === "color"){
        updateColor();
    }
}


function closeModal(){

    modal.classList.remove("show");

    if(clockTimer){
        clearInterval(clockTimer);
        clockTimer = null;
    }
}

document
    .getElementById("closeModal")
    .addEventListener("click",closeModal);

modal.addEventListener("click",(e)=>{

    if(e.target === modal){
        closeModal();
    }

});

document.addEventListener("keydown",(e)=>{

    if(e.key === "Escape"){
        closeModal();
    }

});

/* =========================
   Helpers
========================= */

function input(id,label,placeholder,type="text"){

    return `
        <div class="form-group">
            <label>${label}</label>
            <input
                id="${id}"
                class="form-control"
                type="${type}"
                placeholder="${placeholder}"
            >
        </div>
    `;
}


function select(id,values,labels){

    return `
        <select id="${id}" class="form-control">
            ${values.map((v,i)=>`
                <option value="${v}">${labels[i]}</option>
            `).join("")}
        </select>
    `;
}


function button(text,fn){

    return `
        <button class="action-btn" onclick="${fn}">
            ${text}
        </button>
    `;
}


function num(id){

    return parseFloat(document.getElementById(id).value);
}


function validNumber(value){

    return Number.isFinite(value);
}


/* =========================
   1 النسبة
========================= */

function calcPercent(){

    const part = num("part");
    const total = num("total");

    if(!validNumber(part) || !validNumber(total) || total===0){

        document.getElementById("percentResult").innerHTML =
            "من فضلك أدخل أرقاماً صحيحة.";

        return;
    }

    const result = (part/total)*100;

    document.getElementById("percentResult").innerHTML =
        `<strong>${result.toFixed(2)}%</strong>`;
}


/* =========================
   2 الخصم
========================= */

function calcDiscount(){

    const price = num("price");
    const discount = num("discount");

    if(!validNumber(price) || !validNumber(discount)){

        document.getElementById("discountResult").textContent =
            "أدخل البيانات بشكل صحيح.";

        return;
    }

    const value = price * discount / 100;
    const finalPrice = price - value;

    document.getElementById("discountResult").innerHTML =
        `
        قيمة الخصم: <strong>${value.toFixed(2)}</strong><br>
        السعر بعد الخصم: <strong>${finalPrice.toFixed(2)}</strong>
        `;
}


/* =========================
   3 البقشيش
========================= */

function calcTip(){

    const bill = num("bill");
    const percent = num("tipPercent");

    if(!validNumber(bill) || !validNumber(percent)){

        document.getElementById("tipResult").textContent =
            "أدخل البيانات بشكل صحيح.";

        return;
    }

    const tip = bill * percent / 100;
    const total = bill + tip;

    document.getElementById("tipResult").innerHTML =
        `
        البقشيش: <strong>${tip.toFixed(2)}</strong><br>
        الإجمالي: <strong>${total.toFixed(2)}</strong>
        `;
}


/* =========================
   4 القسط
========================= */

function calcInstallment(){

    const loan = num("loan");
    const months = num("months");
    const interest = num("interest");

    if(
        !validNumber(loan) ||
        !validNumber(months) ||
        months<=0 ||
        !validNumber(interest)
    ){

        document.getElementById("installmentResult").textContent =
            "أدخل البيانات بشكل صحيح.";

        return;
    }

    const total = loan + loan*(interest/100);
    const monthly = total/months;

    document.getElementById("installmentResult").innerHTML =
        `
        إجمالي المبلغ: <strong>${total.toFixed(2)}</strong><br>
        القسط الشهري: <strong>${monthly.toFixed(2)}</strong>
        `;
}


/* =========================
   5 العمر
========================= */

function calcAge(){

    const value = document.getElementById("birthDate").value;

    if(!value){

        document.getElementById("ageResult").textContent =
            "اختر تاريخ الميلاد.";

        return;
    }

    const birth = new Date(value+"T00:00:00");
    const now = new Date();

    if(birth > now){

        document.getElementById("ageResult").textContent =
            "تاريخ الميلاد غير صحيح.";

        return;
    }

    let years = now.getFullYear()-birth.getFullYear();
    let months = now.getMonth()-birth.getMonth();
    let days = now.getDate()-birth.getDate();

    if(days<0){

        months--;

        const previousMonth =
            new Date(now.getFullYear(),now.getMonth(),0);

        days += previousMonth.getDate();
    }

    if(months<0){

        years--;
        months += 12;
    }

    document.getElementById("ageResult").innerHTML =
        `
        عمرك هو:<br>
        <strong>${years}</strong> سنة
        <strong>${months}</strong> شهر
        <strong>${days}</strong> يوم
        `;
}


/* =========================
   6 BMI
========================= */

function calcBMI(){

    const weight = num("bmiWeight");
    const height = num("bmiHeight");

    if(
        !validNumber(weight) ||
        !validNumber(height) ||
        height<=0
    ){

        document.getElementById("bmiResult").textContent =
            "أدخل الوزن والطول بشكل صحيح.";

        return;
    }

    const meters = height/100;
    const bmi = weight/(meters*meters);

    let status = "";

    if(bmi<18.5) status="نقص في الوزن";
    else if(bmi<25) status="وزن طبيعي";
    else if(bmi<30) status="زيادة في الوزن";
    else status="سمنة";

    document.getElementById("bmiResult").innerHTML =
        `
        BMI: <strong>${bmi.toFixed(1)}</strong><br>
        ${status}
        `;
}


/* =========================
   7 السعرات
========================= */

function calcCalories(){

    const weight = num("calWeight");
    const height = num("calHeight");
    const age = num("calAge");

    const gender =
        document.getElementById("calGender").value;

    const activity =
        parseFloat(document.getElementById("activity").value);

    if(
        !validNumber(weight) ||
        !validNumber(height) ||
        !validNumber(age)
    ){

        document.getElementById("calResult").textContent =
            "أدخل البيانات بشكل صحيح.";

        return;
    }

    let bmr;

    if(gender==="male"){

        bmr =
            10*weight +
            6.25*height -
            5*age +
            5;

    }else{

        bmr =
            10*weight +
            6.25*height -
            5*age -
            161;
    }

    const calories = bmr*activity;

    document.getElementById("calResult").innerHTML =
        `
        احتياجك التقريبي:<br>
        <strong>${Math.round(calories)}</strong>
        سعرة يومياً
        `;
}


/* =========================
   8 GPA
========================= */

function calcGPA(){

    const percentage = num("percentage");

    if(!validNumber(percentage)){

        document.getElementById("gpaResult").textContent =
            "أدخل النسبة.";

        return;
    }

    const gpa = Math.max(
        0,
        Math.min(4,percentage/25)
    );

    document.getElementById("gpaResult").innerHTML =
        `GPA التقريبي: <strong>${gpa.toFixed(2)}</strong>`;
}


/* =========================
   9 فرق التاريخ
========================= */

function calcDateDiff(){

    const a = document.getElementById("date1").value;
    const b = document.getElementById("date2").value;

    if(!a || !b){

        document.getElementById("dateDiffResult").textContent =
            "اختر التاريخين.";

        return;
    }

    const d1 = new Date(a+"T00:00:00");
    const d2 = new Date(b+"T00:00:00");

    const diff = Math.abs(d2-d1);

    const days = Math.floor(
        diff/(1000*60*60*24)
    );

    const weeks = Math.floor(days/7);

    document.getElementById("dateDiffResult").innerHTML =
        `
        الفرق: <strong>${days}</strong> يوم<br>
        تقريباً ${weeks} أسبوع
        `;
}


/* =========================
   10 السرعة
========================= */

function calcSpeed(){

    const mode =
        document.getElementById("speedMode").value;

    const distance = num("distance");
    const speed = num("speed");
    const time = num("time");

    let result;

    if(mode==="speed"){

        if(!validNumber(distance)||!validNumber(time)||time===0){
            result="أدخل المسافة والزمن.";
        }else{
            result=`السرعة = ${(
                distance/time
            ).toFixed(2)}`;
        }

    }else if(mode==="distance"){

        if(!validNumber(speed)||!validNumber(time)){
            result="أدخل السرعة والزمن.";
        }else{
            result=`المسافة = ${(
                speed*time
            ).toFixed(2)}`;
        }

    }else{

        if(!validNumber(distance)||!validNumber(speed)||speed===0){
            result="أدخل المسافة والسرعة.";
        }else{
            result=`الزمن = ${(
                distance/speed
            ).toFixed(2)}`;
        }
    }

    document.getElementById("speedResult").innerHTML =
        result;
}

/* =========================
   13 الحرارة
========================= */

function convertTemperature(){

    const value = num("tempValue");

    const from =
        document.getElementById("tempFrom").value;

    const to =
        document.getElementById("tempTo").value;

    if(!validNumber(value)){

        document.getElementById("tempResult").textContent =
            "أدخل قيمة صحيحة.";

        return;
    }

    let celsius;

    if(from==="c") celsius=value;

    if(from==="f")
        celsius=(value-32)*5/9;

    if(from==="k")
        celsius=value-273.15;

    let result;

    if(to==="c")
        result=celsius;

    if(to==="f")
        result=(celsius*9/5)+32;

    if(to==="k")
        result=celsius+273.15;

    document.getElementById("tempResult").innerHTML =
        `<strong>${result.toFixed(2)}</strong> °${to.toUpperCase()}`;
}

/* =========================
   15 فرق الوقت
========================= */

function calcTimeDiff(){

    const a = document.getElementById("time1").value;
    const b = document.getElementById("time2").value;

    if(!a || !b){

        document.getElementById("timeDiffResult").textContent =
            "اختر الوقتين.";

        return;
    }

    const [h1,m1] = a.split(":").map(Number);
    const [h2,m2] = b.split(":").map(Number);

    let start = h1*60+m1;
    let end = h2*60+m2;

    if(end<start){
        end += 24*60;
    }

    const diff = end-start;

    const hours = Math.floor(diff/60);
    const minutes = diff%60;

    document.getElementById("timeDiffResult").innerHTML =
        `
        الفرق:
        <strong>${hours}</strong> ساعة
        <strong>${minutes}</strong> دقيقة
        `;
}

function escapeHTML(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================
   22 Password
========================= */

function generatePassword(){

    let chars =
        "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";

    if(document.getElementById("passNumbers").checked){
        chars += "0123456789";
    }

    if(document.getElementById("passSymbols").checked){
        chars += "!@#$%^&*()-_=+[]{}?";
    }

    let length =
        parseInt(document.getElementById("passLength").value);

    if(!Number.isFinite(length)){
        length=16;
    }

    length=Math.max(4,Math.min(128,length));

    let password="";

    const array = new Uint32Array(length);

    crypto.getRandomValues(array);

    for(let i=0;i<length;i++){

        password +=
            chars[array[i] % chars.length];
    }

    document.getElementById("passResult").innerHTML =
        `
        <div style="direction:ltr;user-select:all;font-size:17px">
            ${escapeHTML(password)}
        </div>
        <button
            class="secondary-btn"
            onclick="copyText('${escapeForAttribute(password)}')"
        >
            نسخ كلمة المرور
        </button>
        `;
}


function escapeForAttribute(text){

    return text
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");
}

/* =========================
   27 Resize
========================= */

function resizeImage(){

    const file =
        document.getElementById("resizeFile").files[0];

    const width =
        parseInt(document.getElementById("newWidth").value);

    const height =
        parseInt(document.getElementById("newHeight").value);

    const result =
        document.getElementById("resizeResult");

    if(!file){

        result.textContent =
            "اختر صورة أولاً.";

        return;
    }

    if(!width || !height || width<=0 || height<=0){

        result.textContent =
            "أدخل أبعاداً صحيحة.";

        return;
    }

    const img = new Image();

    img.onload=()=>{

        const canvas =
            document.createElement("canvas");

        canvas.width=width;
        canvas.height=height;

        const ctx=canvas.getContext("2d");

        ctx.drawImage(img,0,0,width,height);

        canvas.toBlob(blob=>{

            const url =
                URL.createObjectURL(blob);

            result.innerHTML =
                `
                تم تغيير الحجم بنجاح.
                <br>
                <a
                    href="${url}"
                    download="hema-resized-image.png"
                    class="secondary-btn"
                    style="display:block;text-decoration:none;text-align:center;padding-top:10px"
                >
                    تحميل الصورة
                </a>
                `;

        },"image/png");
    };

    img.src =
        URL.createObjectURL(file);
}


/* =========================
   28 Compress
========================= */

function compressImage(){

    const file =
        document.getElementById("compressFile").files[0];

    let quality =
        parseFloat(document.getElementById("quality").value);

    const result =
        document.getElementById("compressResult");

    if(!file){

        result.textContent =
            "اختر صورة أولاً.";

        return;
    }

    if(!Number.isFinite(quality)){
        quality=70;
    }

    quality =
        Math.max(1,Math.min(100,quality));

    const img = new Image();

    img.onload=()=>{

        const canvas =
            document.createElement("canvas");

        canvas.width=img.naturalWidth;
        canvas.height=img.naturalHeight;

        const ctx =
            canvas.getContext("2d");

        ctx.drawImage(img,0,0);

        canvas.toBlob(blob=>{

            const url =
                URL.createObjectURL(blob);

            const oldKB =
                (file.size/1024).toFixed(1);

            const newKB =
                (blob.size/1024).toFixed(1);

            result.innerHTML =
                `
                الحجم الأصلي: <strong>${oldKB} KB</strong><br>
                بعد الضغط: <strong>${newKB} KB</strong>

                <a
                    href="${url}"
                    download="hema-compressed.jpg"
                    class="secondary-btn"
                    style="display:block;text-decoration:none;text-align:center;padding-top:10px"
                >
                    تحميل الصورة المضغوطة
                </a>
                `;

        },"image/jpeg",quality/100);
    };

    img.src =
        URL.createObjectURL(file);
}

let clockTimer = null;

function startClock(){

    updateClock();

    if(clockTimer){
        clearInterval(clockTimer);
    }

    clockTimer =
        setInterval(updateClock,1000);
}


function updateClock(){

    const clock =
        document.getElementById("clockDisplay");

    const date =
        document.getElementById("dateDisplay");

    if(!clock || !date) return;

    const now = new Date();

    clock.textContent =
        now.toLocaleTimeString("ar-EG",{
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit"
        });

    date.textContent =
        now.toLocaleDateString("ar-EG",{
            weekday:"long",
            year:"numeric",
            month:"long",
            day:"numeric"
        });
}


/* =========================
   Copy
========================= */

async function copyText(text){

    try{

        await navigator.clipboard.writeText(text);

        alert("تم النسخ بنجاح ✅");

    }catch(e){

        const area =
            document.createElement("textarea");

        area.value=text;

        document.body.appendChild(area);

        area.select();

        document.execCommand("copy");

        area.remove();

        alert("تم النسخ بنجاح ✅");
    }
}

});
