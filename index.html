<!doctype html>
<html lang="ar" dir="rtl" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Abo Kayan Tools - 30 أداة مجانية">
<title>Abo Kayan Tools</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');

*{box-sizing:border-box}

body{
    font-family:Cairo,sans-serif;
}

.card{
    background:#18181bcc;
    border:1px solid #dc262633;
    backdrop-filter:blur(14px);
}

.tool{
    min-height:150px;
    transition:.2s;
}

.tool:hover{
    transform:translateY(-3px);
    border-color:#dc262688;
}

input,select,textarea{
    font-family:inherit;
}

.field{
    width:100%;
    padding:12px;
    border-radius:12px;
    background:#27272a;
    color:#fff;
    border:1px solid #3f3f46;
    outline:0;
    margin-bottom:10px;
}

.field:focus{
    border-color:#dc2626;
}

.btn{
    background:#dc2626;
    color:#fff;
    padding:11px 15px;
    border-radius:12px;
    font-weight:800;
    cursor:pointer;
}

.result{
    margin-top:12px;
    padding:14px;
    border-radius:12px;
    background:#18181b;
    border:1px solid #3f3f46;
    line-height:2;
    word-break:break-word;
}

.chip{
    padding:8px 15px;
    border-radius:999px;
    background:#27272a;
    white-space:nowrap;
    font-weight:700;
    cursor:pointer;
}

.active{
    background:#dc2626;
}

.hidden{
    display:none!important;
}

.light body{
    background:#f4f4f5;
    color:#18181b;
}

.light .card{
    background:#ffffffdd;
}

.light .field{
    background:#f4f4f5;
    color:#18181b;
}

@media(max-width:480px){
    .tool{
        min-height:135px;
    }

    h1{
        font-size:27px!important;
    }

    .tool b{
        font-size:13px;
    }
}
</style>
</head>

<body class="bg-zinc-950 text-zinc-100 min-h-screen">

<header class="sticky top-0 z-50 card border-x-0 border-t-0">

<div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">

<a class="text-xl font-extrabold text-red-500" href="#">
Abo Kayan Tools
</a>

<div class="flex gap-2 items-center">

<select id="language" class="field !w-auto !py-2 !px-3 !text-xs !mb-0">
<option>العربية</option>
<option>English</option>
</select>

<button class="chip" onclick="theme()">🌙</button>

</div>
</div>
</header>


<main class="max-w-5xl mx-auto px-4 py-7">

<section class="text-center mb-7">

<div class="inline-block px-4 py-2 rounded-full bg-red-950 text-red-400 font-bold mb-4">
⚡ أدوات مجانية وسريعة
</div>

<h1 class="text-3xl sm:text-4xl font-extrabold mb-2">
أهلاً بك في
<span class="text-red-500">Abo Kayan Tools</span>
</h1>

<p class="text-zinc-400">
30 أداة للحساب والتحويل والنصوص والصور في مكان واحد.
</p>

</section>


<div class="card rounded-2xl p-3 mb-4">

<input
id="search"
class="field text-center !mb-0"
placeholder="🔎 ابحث عن أداة... مثال: نسبة، صورة، QR"
oninput="render()">

</div>


<div id="cats" class="flex gap-2 overflow-x-auto pb-3 mb-5">

<button class="chip active" onclick="cat('all',this)">
كل الأدوات
</button>

<button class="chip" onclick="cat('calc',this)">
حاسبات 🧮
</button>

<button class="chip" onclick="cat('text',this)">
نصوص ✍️
</button>

<button class="chip" onclick="cat('image',this)">
صور 🖼️
</button>

<button class="chip" onclick="cat('convert',this)">
تحويل 🔄
</button>

<button class="chip" onclick="cat('other',this)">
أخرى 🛠️
</button>

</div>


<div class="flex justify-between mb-4">

<h2 class="text-2xl font-extrabold">
الأدوات 🔥
</h2>

<span id="count" class="text-zinc-500"></span>

</div>


<div id="grid"
class="grid grid-cols-2 sm:grid-cols-3 gap-3">
</div>

</main>


<div id="modal"
class="hidden fixed inset-0 z-[100] bg-black/75 p-4 overflow-y-auto">

<div class="max-w-lg mx-auto mt-8 card rounded-2xl p-5">

<div class="flex justify-between mb-4">

<h3 id="title"
class="text-xl font-extrabold text-red-500">
</h3>

<button onclick="closeM()" class="text-2xl">
×
</button>

</div>

<div id="body"></div>

</div>
</div>


<footer class="text-center text-zinc-500 text-xs py-8">

© 2026 Abo Kayan Tools
—
جميع الأدوات تعمل داخل المتصفح

</footer>


<script>

const A=[

['percent','🧮','حساب النسبة','نسبة مئوية دقيقة','calc'],

['discount','💸','حاسبة الخصم','السعر قبل وبعد الخصم','calc'],

['tip','💳','حاسبة البقشيش','تقسيم الفاتورة','calc'],

['loan','💰','حاسبة القسط','قسط شهري بسيط','calc'],

['age','🎂','حساب العمر','بالسنين','calc'],

['bmi','⚖️','حاسبة BMI','مؤشر كتلة الجسم','calc'],

['calories','🥗','حاسبة السعرات','سعرات وبروتين','calc'],

['gpa','🎓','حاسبة GPA','المعدل من 4','calc'],

['date','📅','فرق التاريخ','عدد الأيام','calc'],

['speed','🚗','حاسبة السرعة','المسافة والوقت','calc'],

['length','📏','محول الطول','متر وسم وقدم','convert'],

['weight','⚖️','محول الوزن','كجم وجرام ورطل','convert'],

['temp','🌡️','محول الحرارة','مئوية وفهرنهايت','convert'],

['data','💾','محول البيانات','KB وMB وGB','convert'],

['timediff','⏱️','فرق الوقت','بين وقتين','calc'],

['counter','📝','عداد الكلمات','كلمات وحروف','text'],

['case','🔤','حالة النص','UPPER وlower','text'],

['reverse','↩️','عكس النص','اعكس النص','text'],

['base64','🔐','Base64','ترميز وفك ترميز','text'],

['url','🔗','URL Encoder','ترميز الروابط','text'],

['json','{ }','منسق JSON','تنسيق JSON','text'],

['password','🔑','مولد كلمات السر','كلمات مرور قوية','other'],

['random','🎲','رقم عشوائي','بين حدين','other'],

['qr','▣','مولد QR Code','نص أو رابط','other'],

['color','🎨','منتقي الألوان','HEX وRGB','other'],

['binary','💻','محول Binary','نص وثنائي','convert'],

['resize','🖼️','تغيير حجم الصورة','بالبكسل','image'],

['compress','📦','ضغط الصورة','تقليل الحجم','image'],

['pdf','📄','صورة إلى PDF','حفظ بالطباعة','image'],

['clock','🕐','الوقت والتاريخ','الوقت الحالي','other']

];


let C='all';

const $=id=>document.getElementById(id);

const N=id=>parseFloat($(id).value);


function cat(c,e){

C=c;

document
.querySelectorAll('#cats button')
.forEach(x=>x.classList.remove('active'));

e.classList.add('active');

render();

}


function render(){

let q=$('search').value.toLowerCase();

let l=A.filter(x=>
(C==='all'||x[4]===C)&&
(
x[2].toLowerCase().includes(q)||
x[3].toLowerCase().includes(q)
)
);

$('count').textContent=l.length+' أداة';

$('grid').innerHTML=l.map(x=>`

<button
class="tool card rounded-2xl p-4 flex flex-col items-center justify-center text-center"
onclick="openT('${x[0]}')">

<div class="w-12 h-12 rounded-2xl bg-red-950 flex items-center justify-center text-2xl mb-3">
${x[1]}
</div>

<b class="text-sm">
${x[2]}
</b>

<span class="text-[11px] text-zinc-500 mt-1">
${x[3]}
</span>

</button>

`).join('');

}


function theme(){

document.documentElement.classList.toggle('light');

}


function closeM(){

$('modal').classList.add('hidden');

}


function F(id,p,t='text'){

return `
<input
id="${id}"
type="${t}"
placeholder="${p}"
class="field">
`;

}


function T(id,p){

return `
<textarea
id="${id}"
class="field min-h-32"
placeholder="${p}">
</textarea>
`;

}


function B(t,f){

return `
<button
class="btn w-full"
onclick="${f}">
${t}
</button>
`;

}


function R(id='r'){

return `
<div
id="${id}"
class="result">
</div>
`;

}


function S(id,a){

return `
<select
id="${id}"
class="field">

${a.map(x=>
`<option value="${x[0]}">
${x[1]}
</option>`
).join('')}

</select>
`;

}


function out(x,id='r'){

$(id).innerHTML=x;

}


function openT(k){

let x=A.find(a=>a[0]===k);

$('title').textContent=x[1]+' '+x[2];

$('modal').classList.remove('hidden');

let b=$('body');

switch(k){

case'percent':

b.innerHTML=
F('p','الرقم','number')+
F('q','النسبة %','number')+
B('احسب','percent()')+
R();

break;


case'discount':

b.innerHTML=
F('price','السعر','number')+
F('disc','الخصم %','number')+
B('احسب','discount()')+
R();

break;


case'tip':

b.innerHTML=
F('bill','الفاتورة','number')+
F('tipv','البقشيش %','number')+
F('people','عدد الأشخاص','number')+
B('احسب','tip()')+
R();

break;


case'loan':

b.innerHTML=
F('la','المبلغ','number')+
F('lm','الأشهر','number')+
B('احسب','loan()')+
R();

break;


case'age':

b.innerHTML=
F('birth','تاريخ الميلاد','date')+
B('احسب','age()')+
R();

break;


case'bmi':

b.innerHTML=
F('bw','الوزن كجم','number')+
F('bh','الطول سم','number')+
B('احسب','bmi()')+
R();

break;


case'calories':

b.innerHTML=
F('cw','الوزن كجم','number')+
F('ch','الطول سم','number')+
F('ca','العمر','number')+
S('sex',[
['m','ذكر'],
['f','أنثى']
])+
S('goal',[
['lose','خسارة'],
['maintain','ثبات'],
['gain','زيادة']
])+
B('احسب','calories()')+
R();

break;


case'gpa':

b.innerHTML=
F(
'grades',
'درجات مفصولة بفواصل، مثال 90,80,75'
)+
B('احسب','gpa()')+
R();

break;


case'date':

b.innerHTML=
F('d1','التاريخ الأول','date')+
F('d2','التاريخ الثاني','date')+
B('احسب','dated()')+
R();

break;


case'speed':

b.innerHTML=
F('dist','المسافة كم','number')+
F('hrs','الوقت ساعات','number')+
B('احسب','speed()')+
R();

break;


case'length':

b.innerHTML=
F('lv','القيمة','number')+
S('lu',[
['mc','متر → سم'],
['cm','سم → متر'],
['km','كم → متر'],
['mk','متر → كم'],
['fm','قدم → متر'],
['ic','بوصة → سم']
])+
B('تحويل','length()')+
R();

break;


case'weight':

b.innerHTML=
F('wv','القيمة','number')+
S('wu',[
['kg_g','كجم → جرام'],
['g_kg','جرام → كجم'],
['kg_l','كجم → رطل'],
['l_kg','رطل → كجم']
])+
B('تحويل','weight()')+
R();

break;


case'temp':

b.innerHTML=
F('tv','القيمة','number')+
S('tu',[
['cf','مئوية → فهرنهايت'],
['fc','فهرنهايت → مئوية'],
['ck','مئوية → كلفن'],
['kc','كلفن → مئوية']
])+
B('تحويل','temp()')+
R();

break;


case'data':

b.innerHTML=
F('dv','القيمة','number')+
S('du',[
['mg','MB → GB'],
['gm','GB → MB'],
['gt','GB → TB'],
['km','KB → MB']
])+
B('تحويل','data()')+
R();

break;


case'timediff':

b.innerHTML=
F('t1','الوقت الأول','time')+
F('t2','الوقت الثاني','time')+
B('احسب','tdiff()')+
R();

break;


case'counter':

b.innerHTML=
T('ct','اكتب النص...')+
`
<div class="grid grid-cols-3 gap-2">

<div class="result text-center">
كلمات<br>
<b id="wc">0</b>
</div>

<div class="result text-center">
حروف<br>
<b id="cc">0</b>
</div>

<div class="result text-center">
مسافات<br>
<b id="sc">0</b>
</div>

</div>
`;

$('ct').oninput=count;

break;


case'case':

b.innerHTML=
T('ci','النص...')+
S('cs',[
['u','UPPERCASE'],
['l','lowercase']
])+
B('تحويل','cases()')+
R();

break;


case'reverse':

b.innerHTML=
T('ri','النص...')+
B('اعكس','reverse()')+
R();

break;


case'base64':

b.innerHTML=
T('bi','النص...')+
S('bm',[
['e','ترميز'],
['d','فك الترميز']
])+
B('تنفيذ','base64()')+
R();

break;


case'url':

b.innerHTML=
T('ui','الرابط أو النص...')+
S('um',[
['e','ترميز'],
['d','فك الترميز']
])+
B('تنفيذ','urlx()')+
R();

break;


case'json':

b.innerHTML=
T('ji','JSON...')+
B('تنسيق','json()')+
R();

break;


case'password':

b.innerHTML=
F('pl','الطول','number')+
B('توليد','pass()')+
R();

break;


case'random':

b.innerHTML=
F('rmin','الحد الأدنى','number')+
F('rmax','الحد الأقصى','number')+
B('توليد','randomN()')+
R();

break;


case'qr':

b.innerHTML=
F('qr','النص أو الرابط')+
B('إنشاء QR','qr()')+
R('qrout');

break;


case'color':

b.innerHTML=`
<input
id="col"
type="color"
value="#dc2626"
class="w-full h-20">

${R()}

<div
id="cp"
class="h-20 rounded-xl mt-3">
</div>
`;

$('col').oninput=color;

color();

break;


case'binary':

b.innerHTML=
T('bin','النص أو Binary')+
S('bmode',[
['e','نص → Binary'],
['d','Binary → نص']
])+
B('تحويل','binary()')+
R();

break;


case'resize':

b.innerHTML=`
<input
id="rf"
type="file"
accept="image/*"
class="field">
`+
F('rw','العرض الجديد','number')+
F('rh','الارتفاع الجديد','number')+
B('تغيير وتنزيل','resize()')+
R();

break;


case'compress':

b.innerHTML=`
<input
id="cf"
type="file"
accept="image/*"
class="field">
`+
F('cq','الجودة 10-100','number')+
B('ضغط وتنزيل','compress()')+
R();

break;


case'pdf':

b.innerHTML=`
<input
id="pf"
type="file"
accept="image/*"
class="field">
`+
B('فتح للطباعة وحفظ PDF','pdf()');

break;


case'clock':

b.innerHTML=`
<div
id="clock"
class="text-center text-2xl font-extrabold text-red-500">
</div>
`;

clock();

break;

}

}


function percent(){

out(
'الناتج: <b>'+
((N('p')*N('q'))/100).toFixed(2)+
'</b>'
);

}


function discount(){

let p=N('price');

let d=N('disc');

let value=p*d/100;

out(
'قيمة الخصم: '+
value.toFixed(2)+
'<br>السعر بعد الخصم: <b>'+
(p-value).toFixed(2)+
'</b>'
);

}


function tip(){

let b=N('bill');

let t=N('tipv');

let p=Math.max(1,N('people'));

let tip=b*t/100;

let total=b+tip;

out(
'البقشيش: '+tip.toFixed(2)+
'<br>الإجمالي: '+total.toFixed(2)+
'<br>لكل شخص: <b>'+
(total/p).toFixed(2)+
'</b>'
);

}


function loan(){

out(
'القسط الشهري: <b>'+
(N('la')/N('lm')).toFixed(2)+
'</b>'
);

}


function age(){

let b=new Date($('birth').value);

let n=new Date();

let a=n.getFullYear()-b.getFullYear();

if(
n.getMonth()<b.getMonth()||
(
n.getMonth()==b.getMonth()&&
n.getDate()<b.getDate()
)
)a--;

out(
'عمرك: <b>'+
a+
' سنة</b>'
);

}


function bmi(){

let b=N('bw');

let h=N('bh')/100;

let x=b/h**2;

let s=
x<18.5?'نحيف':
x<25?'طبيعي':
x<30?'زيادة وزن':
'سمنة';

out(
'BMI: <b>'+
x.toFixed(1)+
'</b><br>'+
s
);

}


function calories(){

let w=N('cw');

let h=N('ch');

let a=N('ca');

let base=
$('sex').value==='m'
?
10*w+6.25*h-5*a+5
:
10*w+6.25*h-5*a-161;

let g=$('goal').value;

let t=
base*1.375+
(
g==='lose'?-400:
g==='gain'?300:
0
);

out(
'السعرات التقديرية: <b>'+
Math.round(t)+
' سعرة</b>'+
'<br>البروتين: '+
Math.round(w*1.6)+
'–'+
Math.round(w*2)+
' جم'
);

}


function gpa(){

let a=
$('grades')
.value
.split(',')
.map(Number)
.filter(x=>!isNaN(x));

if(!a.length){

out('أدخل الدرجات أولاً');

return;

}

let v=
a.reduce((x,y)=>x+y,0)/
a.length;

out(
'المتوسط: '+
v.toFixed(2)+
'%<br>GPA تقريبي: <b>'+
Math.min(4,v/25).toFixed(2)+
'</b>'
);

}


function dated(){

let d=
Math.abs(
Math.round(
(
new Date($('d2').value)-
new Date($('d1').value)
)/86400000
)
);

out(
'الفرق: <b>'+
d+
' يوم</b>'
);

}


function speed(){

out(
'السرعة: <b>'+
(N('dist')/N('hrs')).toFixed(2)+
' كم/ساعة</b>'
);

}


function length(){

let v=N('lv');

let t=$('lu').value;

let r={
mc:v*100,
cm:v/100,
km:v*1000,
mk:v/1000,
fm:v*.3048,
ic:v*2.54
}[t];

out(
'الناتج: <b>'+
r.toFixed(4)+
'</b>'
);

}


function weight(){

let v=N('wv');

let t=$('wu').value;

let r={
kg_g:v*1000,
g_kg:v/1000,
kg_l:v*2.2046226,
l_kg:v/2.2046226
}[t];

out(
'الناتج: <b>'+
r.toFixed(4)+
'</b>'
);

}


function temp(){

let v=N('tv');

let t=$('tu').value;

let r={
cf:v*9/5+32,
fc:(v-32)*5/9,
ck:v+273.15,
kc:v-273.15
}[t];

out(
'الناتج: <b>'+
r.toFixed(2)+
'</b>'
);

}


function data(){

let v=N('dv');

let t=$('du').value;

let r={
mg:v/1024,
gm:v*1024,
gt:v/1024,
km:v/1024
}[t];

out(
'الناتج: <b>'+
r.toFixed(4)+
'</b>'
);

}


function tdiff(){

let a=$('t1').value.split(':');

let b=$('t2').value.split(':');

let d=
Math.abs(
(+b[0]*60+ +b[1])-
(+a[0]*60+ +a[1])
);

out(
'الفرق: <b>'+
Math.floor(d/60)+
' ساعة و '+
d%60+
' دقيقة</b>'
);

}


function count(){

let s=$('ct').value;

$('wc').textContent=
s.trim()?
s.trim().split(/\s+/).length:
0;

$('cc').textContent=s.length;

$('sc').textContent=
(s.match(/\s/g)||[]).length;

}


function cases(){

out(
$('cs').value==='u'
?
$('ci').value.toUpperCase()
:
$('ci').value.toLowerCase()
);

}


function reverse(){

out(
$('ri')
.value
.split('')
.reverse()
.join('')
.replace(/</g,'&lt;')
);

}


function base64(){

try{

let s=$('bi').value;

out(
$('bm').value==='e'
?
btoa(unescape(encodeURIComponent(s)))
:
decodeURIComponent(escape(atob(s)))
);

}

catch(e){

out('النص غير صالح');

}

}

out(
$('um').value==='e'
?
encodeURIComponent($('ui').value)
:
decodeURIComponent($('ui').value)
);

catch(e){

}

}


function json(){

'<pre class="whitespace-pre-wrap">'+

null,
2

.replace(/</g,'&lt;')+

);

}


function pass(){

let n=
Math.min(
100,
Math.max(
4,
N('pl')||12
)
);

let c=
'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*_-+';

let a=new Uint32Array(n);

crypto.getRandomValues(a);

out(
'<b class="break-all">'+
[...a]
.map(x=>c[x%c.length])
.join('')+
'</b>'
);

}


function randomN(){

let a=N('rmin');

let b=N('rmax');

if(a>b){

let t=a;

a=b;

b=t;

}

out(
'<b>'+
Math.floor(
Math.random()*
(b-a+1)+a
)+
'</b>'
);

}

function binary(){

let s=$('bin').value;

if($('bmode').value==='e'){

out(
[...s]
.map(
c=>
c.charCodeAt(0)
.toString(2)
.padStart(8,'0')
)
.join(' ')
);

}

else{

try{

out(
s.trim()
.split(/\s+/)
.map(
x=>
String.fromCharCode(
parseInt(x,2)
)
)
.join('')
);

}

catch(e){

out('Binary غير صالح');

}

}

}


function img(f,cb){

let r=new FileReader();

r.onload=()=>{

let i=new Image();

i.onload=()=>cb(i);

i.src=r.result;

};

r.readAsDataURL(f);

}


function dl(c,n,q=.8){

let a=document.createElement('a');

a.href=c.toDataURL(
'image/jpeg',
q
);

a.download=n;

a.click();

}


function resize(){

let f=$('rf').files[0];

if(!f){

out('اختر صورة');

return;

}

img(f,i=>{

let c=document.createElement('canvas');

c.width=N('rw')||i.width;

c.height=N('rh')||i.height;

c.getContext('2d')
.drawImage(
i,
0,
0,
c.width,
c.height
);

dl(c,'resized.jpg');

out('تم تنزيل الصورة');

});

}


function compress(){

let f=$('cf').files[0];

if(!f){

out('اختر صورة');

return;

}

let q=
Math.min(
100,
Math.max(
10,
N('cq')||70
)
)/100;

img(f,i=>{

let c=document.createElement('canvas');

c.width=i.width;

c.height=i.height;

c.getContext('2d')
.drawImage(i,0,0);

dl(
c,
'compressed.jpg',
q
);

out(
'تم ضغط وتنزيل الصورة'
);

});

}


function pdf(){

let f=$('pf').files[0];

if(!f){

alert('اختر صورة');

return;

}

let r=new FileReader();

r.onload=()=>{

let w=open();

w.document.write(
'<img style="max-width:100%" src="'+
r.result+
'">'
);

setTimeout(
()=>w.print(),
500
);

};

r.readAsDataURL(f);

}


function clock(){

let e=$('clock');

if(!e)return;

e.textContent=
new Date()
.toLocaleString(
'ar-EG',
{
dateStyle:'full',
timeStyle:'medium'
}
);

setTimeout(
clock,
1000
);

}
